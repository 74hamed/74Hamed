<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#020503"/>
    <stop offset=".5" stop-color="#061009"/>
    <stop offset="1" stop-color="#020403"/>
  </linearGradient>
  <radialGradient id="glow" cx="50%" cy="48%" r="52%">
    <stop offset="0" stop-color="#16f16a" stop-opacity=".09"/>
    <stop offset="1" stop-color="#16f16a" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#16f16a" stop-opacity="0"/>
    <stop offset=".5" stop-color="#16f16a" stop-opacity=".08"/>
    <stop offset="1" stop-color="#16f16a" stop-opacity="0"/>
  </linearGradient>
  <clipPath id="type1"><rect x="0" y="0" width="0" height="28"><animate attributeName="width" from="0" to="180" dur="1.1s" begin=".5s" fill="freeze"/></rect></clipPath>
  <clipPath id="type2"><rect x="0" y="0" width="0" height="28"><animate attributeName="width" from="0" to="285" dur="1.5s" begin="2.1s" fill="freeze"/></rect></clipPath>
  <clipPath id="type3"><rect x="0" y="0" width="0" height="28"><animate attributeName="width" from="0" to="430" dur="1.8s" begin="4.2s" fill="freeze"/></rect></clipPath>
</defs>

<rect width="1200" height="500" fill="url(#bg)"/>
<rect width="1200" height="500" fill="url(#glow)"/>

<!-- subtle matrix rain -->
<g font-family="Consolas,Menlo,monospace" font-size="13" fill="#16f16a" opacity=".12">
  <text x="62" y="-20">1 0 ア 7 # キ 0 1 % サ
    <animate attributeName="y" values="-20;520" dur="11s" repeatCount="indefinite"/>
  </text>
  <text x="178" y="-180">ツ 1 0 0 ミ 4 1 ナ 0
    <animate attributeName="y" values="-180;520" dur="14s" repeatCount="indefinite"/>
  </text>
  <text x="1020" y="-90">0 1 シ % 8 0 リ 1 #
    <animate attributeName="y" values="-90;520" dur="12.5s" repeatCount="indefinite"/>
  </text>
  <text x="1110" y="-240">サ 0 1 7 ナ 0 # 4 1
    <animate attributeName="y" values="-240;520" dur="15s" repeatCount="indefinite"/>
  </text>
</g>

<g stroke="#16f16a" stroke-opacity=".045">
  <path d="M0 64h1200M0 438h1200"/>
  <path d="M170 0v500M1030 0v500"/>
</g>

<!-- top prompt -->
<g font-family="Consolas,Menlo,monospace">
  <text x="58" y="44" fill="#16f16a" font-size="16" font-weight="700">~/74Hamed</text>
  <rect x="160" y="29" width="9" height="18" fill="#16f16a">
    <animate attributeName="opacity" values="1;0;1" dur=".9s" repeatCount="indefinite"/>
  </rect>
  <text x="840" y="44" fill="#607267" font-size="12">./about   ./projects   ./skills   ./contact</text>
</g>

<!-- terminal -->
<g transform="translate(260 92)">
  <rect width="680" height="250" rx="9" fill="#061009" stroke="#1a5f32" stroke-width="1.2"/>
  <rect width="680" height="38" rx="9" fill="#0a150d"/>
  <path d="M0 38h680" stroke="#173621"/>
  <circle cx="22" cy="19" r="5" fill="#ff6258"/>
  <circle cx="40" cy="19" r="5" fill="#ffbd2e"/>
  <circle cx="58" cy="19" r="5" fill="#28c840"/>
  <text x="82" y="24" fill="#6f8374" font-size="12" font-family="Consolas,Menlo,monospace">visitor@portfolio: ~</text>

  <g font-family="Consolas,Menlo,monospace" font-size="15">
    <text x="24" y="80" fill="#16f16a">$</text>
    <g transform="translate(44 61)" clip-path="url(#type1)">
      <text x="0" y="19" fill="#e7f7ec" font-weight="700">whoami</text>
    </g>
    <g opacity="0">
      <text x="24" y="104" fill="#8ea092">74Hamed — Creative Developer</text>
      <animate attributeName="opacity" from="0" to="1" dur=".2s" begin="1.75s" fill="freeze"/>
    </g>

    <g opacity="0">
      <text x="24" y="145" fill="#16f16a">$</text>
      <animate attributeName="opacity" from="0" to="1" dur=".15s" begin="2s" fill="freeze"/>
    </g>
    <g transform="translate(44 126)" clip-path="url(#type2)">
      <text x="0" y="19" fill="#e7f7ec" font-weight="700">cat focus.txt</text>
    </g>
    <g opacity="0">
      <text x="24" y="169" fill="#8ea092">web dev · desktop apps · ui/ux · ai tools</text>
      <animate attributeName="opacity" from="0" to="1" dur=".2s" begin="3.75s" fill="freeze"/>
    </g>

    <g opacity="0">
      <text x="24" y="210" fill="#16f16a">$</text>
      <animate attributeName="opacity" from="0" to="1" dur=".15s" begin="4.05s" fill="freeze"/>
    </g>
    <g transform="translate(44 191)" clip-path="url(#type3)">
      <text x="0" y="19" fill="#e7f7ec" font-weight="700">./launch_portfolio.sh</text>
    </g>
    <g opacity="0">
      <text x="24" y="234" fill="#16f16a">[ OK ]</text>
      <text x="82" y="234" fill="#8ea092">all systems online — scroll to explore ↓</text>
      <animate attributeName="opacity" from="0" to="1" dur=".25s" begin="6.1s" fill="freeze"/>
    </g>
  </g>
</g>

<!-- title -->
<g font-family="Consolas,Menlo,monospace" text-anchor="middle">
  <g opacity="0">
    <text x="600" y="389" fill="#6f8374" font-size="13">// hello world, i am</text>
    <animate attributeName="opacity" from="0" to="1" dur=".5s" begin=".2s" fill="freeze"/>
  </g>
  <g opacity="0">
    <text x="600" y="434" fill="#ebf8ee" font-size="52" font-weight="700">74Hamed</text>
    <animate attributeName="opacity" from="0" to="1" dur=".55s" begin=".55s" fill="freeze"/>
  </g>
  <g opacity="0">
    <text x="600" y="466" fill="#93a497" font-size="15">developer &amp; designer crafting software with intent_</text>
    <animate attributeName="opacity" from="0" to="1" dur=".55s" begin=".9s" fill="freeze"/>
  </g>
</g>

<!-- moving scanline -->
<rect x="0" y="-35" width="1200" height="34" fill="url(#scan)" opacity=".8">
  <animate attributeName="y" values="-35;500" dur="5.5s" repeatCount="indefinite"/>
</rect>

<!-- tiny status pulse -->
<circle cx="1128" cy="456" r="4" fill="#16f16a">
  <animate attributeName="opacity" values=".2;1;.2" dur="1.8s" repeatCount="indefinite"/>
</circle>
<text x="1110" y="461" text-anchor="end" fill="#65776b" font-size="11" font-family="Consolas,Menlo,monospace">online</text>
</svg>