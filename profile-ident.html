<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>74Hamed — 15s Portfolio Ident</title>
<style>
@font-face{font-family:"JetBrains Mono";src:url("./assets/fonts/JetBrainsMono.ttf") format("truetype");font-weight:100 800;font-style:normal;font-display:block}
:root{--bg:#050805;--g:#00ff41;--s:#7dffa0;--dim:#2a7a40;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--s);font-family:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;overflow:hidden}
#stage{position:relative;width:min(100vw,calc((100vh - 90px)*16/9));aspect-ratio:16/9;background:var(--bg)}
canvas{width:100%;height:100%;display:block;outline:1px solid rgba(0,255,65,.18)}
#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(5,8,5,.55);cursor:pointer}
#overlay button{font:700 clamp(14px,2vw,22px) "JetBrains Mono",monospace;color:var(--g);background:rgba(5,8,5,.9);border:1px solid var(--g);padding:.9em 1.6em;cursor:pointer;text-shadow:0 0 8px rgba(0,255,65,.6)}
#bar{width:min(100vw - 24px,calc((100vh - 90px)*16/9));display:flex;align-items:center;gap:12px;font-size:13px}
#bar button{font:500 13px "JetBrains Mono",monospace;color:var(--g);background:transparent;border:1px solid rgba(0,255,65,.5);padding:.5em 1em;cursor:pointer}
#bar button:hover,#bar button:focus-visible,#overlay button:hover,#overlay button:focus-visible{background:rgba(0,255,65,.12);outline:2px solid var(--s);outline-offset:2px}
#bar button:disabled{opacity:.4;cursor:default}
#prog{flex:1;height:3px;background:rgba(0,255,65,.18);position:relative}
#prog i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--g)}
#tc{min-width:12ch;text-align:right;color:var(--s)}
#msg{position:absolute;left:0;right:0;bottom:-1.6em;font-size:12px;color:var(--dim);text-align:center}
@media(max-width:600px){#bar{flex-wrap:wrap;gap:8px;font-size:11px}#bar button{font-size:11px;padding:.5em .65em;white-space:nowrap}#prog{min-width:120px}#tc{font-size:11px}}
</style>
</head>
<body>
<div id="stage">
  <canvas id="c" width="1920" height="1080"></canvas>
  <div id="overlay"><button id="play">▶ PLAY WITH SOUND</button></div>
</div>
<div id="bar">
  <button id="replay" disabled>↺ Replay</button>
  <button id="rec" disabled>● Export .webm (video + audio)</button>
  <div id="prog"><i id="pi"></i></div>
  <div id="tc">00.00 / 15.00</div>
</div>
<script>
(()=>{
const W=1920,H=1080,DUR=15;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const BG='#050805',G='#00ff41',S='#7dffa0';
const FF='"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace';

/* ---------- math helpers ---------- */
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const pr=(t,a,b)=>cl((t-a)/(b-a));
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const eo=x=>1-Math.pow(1-x,3);
const lerp=(a,b,x)=>a+(b-a)*x;
const hash=n=>{const s=Math.sin(n*127.1+311.7)*43758.5453;return s-Math.floor(s)};
const mixRect=(a,b,k)=>({x:lerp(a.x,b.x,k),y:lerp(a.y,b.y,k),w:lerp(a.w,b.w,k),h:lerp(a.h,b.h,k)});
const scaleRect=(r,s)=>({x:r.x+r.w*(1-s)/2,y:r.y+r.h*(1-s)/2,w:r.w*s,h:r.h*s});

/* ---------- global alpha multiplier + draw primitives ---------- */
let GA=1;
function tw(s,size,w=500){ctx.save();ctx.font=`${w} ${size}px ${FF}`;const m=ctx.measureText(s).width;ctx.restore();return m}
function T(s,x,y,size,col,a=1,o={}){
  if(a<=0||!s)return;
  ctx.save();ctx.globalAlpha=cl(a*GA);ctx.font=`${o.w||500} ${size}px ${FF}`;
  ctx.textAlign=o.al||'left';ctx.textBaseline='middle';ctx.fillStyle=col;
  if(o.g){ctx.shadowColor=G;ctx.shadowBlur=o.g}
  ctx.fillText(s,x,y);ctx.restore();
}
function RC(x,y,w,h,o={}){
  const {s=G,sa=1,lw=2,f=null,fa=0,g=0,r=0}=o;
  if(w<=0.5||h<=0.5)return;
  ctx.save();ctx.shadowColor=G;ctx.shadowBlur=g;ctx.beginPath();
  if(r&&ctx.roundRect)ctx.roundRect(x,y,w,h,r);else ctx.rect(x,y,w,h);
  if(f&&fa>0){ctx.globalAlpha=cl(fa*GA);ctx.fillStyle=f;ctx.fill()}
  if(sa>0){ctx.globalAlpha=cl(sa*GA);ctx.strokeStyle=s;ctx.lineWidth=lw;ctx.stroke()}
  ctx.restore();
}
function LN(x1,y1,x2,y2,col=G,a=1,lw=2,g=0,dash=null){
  if(a<=0)return;
  ctx.save();ctx.globalAlpha=cl(a*GA);ctx.strokeStyle=col;ctx.lineWidth=lw;ctx.shadowColor=G;ctx.shadowBlur=g;
  if(dash)ctx.setLineDash(dash);
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.restore();
}
function CI(x,y,r,col,a=1,lw=2,fill=false,g=0){
  if(a<=0||r<=0)return;
  ctx.save();ctx.globalAlpha=cl(a*GA);ctx.shadowColor=G;ctx.shadowBlur=g;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);
  if(fill){ctx.fillStyle=col;ctx.fill()}else{ctx.strokeStyle=col;ctx.lineWidth=lw;ctx.stroke()}ctx.restore();
}
function POLY(pts,col,a=1,lw=2,close=false,g=0){
  if(a<=0)return;
  ctx.save();ctx.globalAlpha=cl(a*GA);ctx.strokeStyle=col;ctx.lineWidth=lw;ctx.shadowColor=G;ctx.shadowBlur=g;ctx.lineJoin='round';
  ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));if(close)ctx.closePath();ctx.stroke();ctx.restore();
}
function curs(x,y,size,t,solid){
  if(!solid&&((t*2)%1)>0.6)return;
  RC(x+2,y-size*.52,size*.5,size*1.05,{s:G,sa:0,f:G,fa:1,g:14});
}
/* kinetic text: per-char rise + fade */
function kin(s,x,y,size,col,t,t0,stag,o={}){
  const adv=size*0.6;
  for(let i=0;i<s.length;i++){
    const a=eo(pr(t,t0+i*stag,t0+i*stag+0.22));
    if(a<=0||s[i]===' ')continue;
    T(s[i],x+i*adv,y+(1-a)*size*.4,size,col,a,{w:o.w||700,g:o.g||0});
  }
}
/* frame */
function FR(r,a=1,o={}){
  const {bar=0,flash=0,fillA=.92,lw=2}=o;
  if(a<=0)return;
  ctx.save();
  ctx.globalAlpha=cl(a*fillA*GA);ctx.fillStyle=BG;ctx.fillRect(r.x,r.y,r.w,r.h);
  ctx.restore();
  RC(r.x,r.y,r.w,r.h,{s:G,sa:a*(.5+.5*flash),lw,g:8+flash*20});
  const L=Math.min(26,r.w/4,r.h/4),c=[[r.x,r.y,1,1],[r.x+r.w,r.y,-1,1],[r.x,r.y+r.h,1,-1],[r.x+r.w,r.y+r.h,-1,-1]];
  c.forEach(([x,y,sx,sy])=>POLY([[x+sx*L,y],[x,y],[x,y+sy*L]],S,a*.95,3));
  if(bar>0){
    LN(r.x,r.y+52,r.x+r.w,r.y+52,G,a*bar*.3,1);
    for(let i=0;i<3;i++)CI(r.x+30+i*22,r.y+26,5,S,a*bar*.75,2);
  }
}

/* ---------- layout constants ---------- */
const WIN={x:360,y:190,w:1200,h:700};
const BIG={x:100,y:150,w:1720,h:780};
const PN=[0,1,2].map(i=>({x:110+i*580,y:230,w:540,h:620}));
const TILE=[{x:110,y:230,w:820,h:620},{x:990,y:230,w:820,h:620}];
const TITLE_Y=500;

/* ---------- typing schedule (shared with audio) ---------- */
const TY={who:{s:'> whoami',t0:.8,cps:16},sub:{s:'Creative Developer & Designer',t0:2.2,cps:48},cmd:{s:'> ./send_message',t0:12.5,cps:48}};
const typed=(o,t)=>o.s.slice(0,cl(Math.floor((t-o.t0)*o.cps),0,o.s.length));

/* ---------- camera ---------- */
function camScale(t){
  if(t<3)return 1+.06*eio(t/3);
  if(t<3.6)return lerp(1.06,1,eio(pr(t,3,3.6)));
  if(t<12.8)return 1+.02*((t-3.6)/9.2);
  if(t<13)return lerp(1.02,1,eio(pr(t,12.8,13)));
  const p=pr(t,13,13.3);return 1+.012*Math.sin(p*Math.PI);
}

/* ---------- rain ---------- */
const CH='01{}[]<>/\\=+*;:#$%&74HAMED';
const COLS=[];for(let i=0;i<58;i++)COLS.push({x:i*33.5+hash(i)*18,sp:70+hash(i+9)*150,off:hash(i+3)*H*2,len:8+Math.floor(hash(i+5)*10),layer:i%3===0?1:0});
function rainA(t){
  if(t<.9)return 0;
  if(t<2)return lerp(0,.35,pr(t,.9,2));
  if(t<3)return lerp(.35,.22,pr(t,2,3));
  if(t<5.7)return .22;
  if(t<6)return lerp(.22,.14,pr(t,5.7,6));
  if(t<10)return .14;
  if(t<10.5)return lerp(.14,.2,pr(t,10,10.5));
  if(t<12)return .2;
  return lerp(.2,.11,pr(t,12,12.5));
}
function drawRain(t,a,layer){
  if(a<=0)return;
  const fs=layer?24:15,step=fs*1.2;
  ctx.save();ctx.font=`500 ${fs}px ${FF}`;ctx.textAlign='center';ctx.textBaseline='middle';
  COLS.forEach((c,i)=>{
    if(c.layer!==layer)return;
    const span=H+c.len*step+60;
    const head=((t*c.sp*(layer?1.25:.8)+c.off)%span)-30;
    for(let k=0;k<c.len;k++){
      const y=head-k*step;if(y<-20||y>H+20)continue;
      const ch=CH[Math.floor(hash(i*31+k*7+Math.floor(t*3+i))*CH.length)];
      ctx.globalAlpha=a*(layer?1:.7)*(1-k/c.len)*(k===0?1:.55);
      ctx.fillStyle=k===0?S:G;ctx.fillText(ch,c.x,y);
    }
  });
  ctx.restore();
}

/* ---------- overlay fx ---------- */
const SL=document.createElement('canvas');SL.width=W;SL.height=H;
(()=>{const c=SL.getContext('2d');c.fillStyle='rgba(0,0,0,.26)';for(let y=0;y<H;y+=3)c.fillRect(0,y,W,1);
const g=c.createRadialGradient(W/2,H/2,H*.35,W/2,H/2,H*.95);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.6)');c.fillStyle=g;c.fillRect(0,0,W,H);})();

/* ---------- title particles ---------- */
let PTS=[];
function buildParticles(){
  const o=document.createElement('canvas');o.width=1000;o.height=300;const c=o.getContext('2d');
  c.fillStyle='#fff';c.font=`800 190px ${FF}`;c.textAlign='center';c.textBaseline='middle';c.fillText('74Hamed',500,150);
  const d=c.getImageData(0,0,1000,300).data;PTS=[];let n=0;
  for(let y=0;y<300;y+=7)for(let x=0;x<1000;x+=7){
    if(d[(y*1000+x)*4+3]>140){
      n++;PTS.push({tx:960+(x-500),ty:TITLE_Y+(y-150),sx:960+(x-500)+(hash(n*3)-.5)*900,sy:-hash(n*5)*500-60,d:hash(n*7),ch:CH[Math.floor(hash(n*11)*CH.length)],c:hash(n*13)>.6?S:G});
    }
  }
}
function title(cx,cy,size,a,gl,t){
  if(gl){
    const seed=Math.floor(t*60),bands=7,bh=size*1.15/bands;
    for(let b=0;b<bands;b++){
      ctx.save();ctx.beginPath();ctx.rect(cx-700,cy-size*.58+b*bh,1400,bh+1);ctx.clip();
      const dx=(hash(seed*13+b)-.5)*(hash(seed+b*3)>.45?70:6);
      T('74Hamed',cx+dx,cy,size,b%2?S:G,a,{al:'center',w:800,g:16});ctx.restore();
    }
  }else T('74Hamed',cx,cy,size,G,a,{al:'center',w:800,g:16});
}

/* ======================= SCENE 1 : 0–3 ======================= */
function s1(t){
  if(t>3.9)return;
  const wa=eo(pr(t,.4,.9));
  let r=scaleRect(WIN,lerp(.95,1,wa));
  if(t>3)r=mixRect(WIN,BIG,eio(pr(t,3,3.5)));
  const fa=wa*(1-pr(t,3.5,3.9));
  FR(r,fa,{bar:1-pr(t,3,3.2),flash:t<2.3&&t>=2?1-pr(t,2,2.3):0});
  const ca=1-pr(t,3,3.3);
  if(ca<=0)return;
  // prompt
  const px=WIN.x+48,py=WIN.y+112,ty=typed(TY.who,t);
  T(ty,px,py,34,S,ca,{g:6});
  const typing=t>=TY.who.t0&&t<TY.who.t0+TY.who.s.length/TY.who.cps+.05;
  if(t<3)curs(px+tw(ty,34),py,34,t,typing);
  // falling code -> title
  if(t>1.1&&t<2.05){
    ctx.save();ctx.font=`600 13px ${FF}`;ctx.textAlign='center';ctx.textBaseline='middle';
    for(const p of PTS){
      const u=pr(t,1.15+p.d*.35,1.65+p.d*.35);if(u<=0)continue;
      const e=eio(u),x=lerp(p.sx,p.tx,e),y=lerp(p.sy,p.ty,e);
      ctx.globalAlpha=(.35+.65*e)*(1-pr(t,1.95,2.05))*GA*ca;ctx.fillStyle=p.c;
      ctx.fillText(u<1&&hash(p.tx+p.ty+Math.floor(t*20))>.5?CH[Math.floor(hash(p.tx*p.ty+Math.floor(t*20))*CH.length)]:p.ch,x,y);
    }
    ctx.restore();
  }
  // title + subtitle
  if(t>=2){
    const lift=-40*eio(pr(t,3,3.3));
    title(960,TITLE_Y+lift,190,ca*pr(t,2,2.04),t<2.16,t);
    const sub=typed(TY.sub,t),x0=960-tw(TY.sub.s,44)/2;
    T(sub,x0,640+lift,44,S,ca,{g:6});
  }
}

/* ======================= SCENE 2 : 3–6 ======================= */
const LW=[180,260,120,320,210,150,290,100,240,330,170,220,130,260],IND=[0,1,1,2,2,1,2,2,1,1,2,2,1,0];
const START=LW.map((w,i)=>[IND[i]*22,14+i*32,w,10]);
const TG=[
 [[0,0,468,36],[14,12,12,12],[34,12,12,12],[54,12,12,12],[90,8,250,20],[0,56,468,170],[24,86,220,16],[24,116,160,10],[24,150,90,30],[0,250,148,170],[160,250,148,170],[320,250,148,170],[0,436,468,14],[300,64,140,10]],
 [[0,20,468,420],[0,20,468,36],[14,32,12,12],[34,32,12,12],[54,32,12,12],[0,56,120,384],[14,80,92,12],[14,110,70,12],[14,140,80,12],[140,76,200,16],[140,112,308,120],[140,248,144,110],[304,248,144,110],[0,420,468,20]],
 [[0,0,468,460],[16,16,436,36],[28,26,60,16],[16,68,260,190],[296,68,156,16],[296,98,156,10],[296,118,120,10],[296,150,100,36],[16,278,136,150],[166,278,136,150],[316,278,136,150],[296,206,56,22],[296,240,156,8],[410,26,20,20]]
];
const LABELS=['WEBSITES','DESKTOP APPS','UI/UX DESIGN'];
function panel(k,t){
  const rt=3.5+k*.5,P=PN[k];
  if(t<rt||t>=6)return;
  const u=eo(pr(t,rt,rt+.35));
  let r=scaleRect(P,lerp(.9,1,u)),fa=u;
  const m=eio(pr(t,5.7,6));
  if(k===0)r=mixRect(r,TILE[0],m);
  else if(k===2)r=mixRect(r,TILE[1],m);
  else{r=mixRect(r,{x:P.x,y:540,w:P.w,h:2},m);fa=u*(1-m)}
  FR(r,fa,{flash:1-pr(t,rt,rt+.22)});
  if(t>=5.7)return;
  const ca=1-pr(t,5.5,5.7);
  kin(LABELS[k],P.x+36,P.y+56,40,G,t,rt+.05,.025,{w:700,g:12});
  const old=GA;GA=old*ca;
  const lt=t-rt,ox=P.x+36,oy=P.y+120,tg=TG[k];
  for(let i=0;i<14;i++){
    const s=START[i],g=tg[i];
    const ap=eo(pr(lt,.12+i*.02,.35+i*.02)),m2=eio(pr(lt,.45+i*.02,.9+i*.02));
    if(ap<=0)continue;
    const col=i%3===1?S:G;
    RC(ox+lerp(s[0],g[0],m2),oy+lerp(s[1],g[1],m2),lerp(s[2]*ap,g[2],m2),lerp(s[3],g[3],m2),{s:col,sa:m2*.9,lw:2,f:col,fa:lerp(.6,.06,m2)});
  }
  const ex=eo(pr(lt,1,1.3));
  if(ex>0){
    const sy=oy+((lt*.55)%1)*460;
    LN(ox,sy,ox+468,sy,S,.22*ex,1.5);
    if(k===0&&Math.floor(lt*2)%2===0)RC(ox+24+226,oy+86,10,16,{s:G,sa:0,f:G,fa:ex,g:8});
    if(k===1)RC(ox+156,oy+112+92,276*((lt*.5)%1),8,{s:G,sa:0,f:G,fa:.7*ex});
    if(k===2){
      LN(ox+16,oy+68,ox+276,oy+258,G,.35*ex,1.2);LN(ox+276,oy+68,ox+16,oy+258,G,.35*ex,1.2);
      CI(ox+296+12+32*(.5+.5*Math.sin(lt*3)),oy+217,8,S,ex,2,true,8);
      LN(ox+16,oy-6,ox+16,oy+466,S,.18*ex,1,0,[5,6]);LN(ox+452,oy-6,ox+452,oy+466,S,.18*ex,1,0,[5,6]);
    }
  }
  GA=old;
}
function s2(t){if(t<3.5||t>=6)return;for(let k=0;k<3;k++)panel(k,t)}

/* ======================= SCENE 3 : 6–10 ======================= */
function rs(x,y,w,h){return [[x,y,x+w,y],[x+w,y,x+w,y+h],[x+w,y+h,x,y+h],[x,y+h,x,y]]}
const DAY=[];
DAY.push(...rs(0,0,748,460),[0,40,748,40],...rs(100,10,300,20),[480,20,540,20],[580,20,640,20],[660,20,720,20]);
DAY.push([10,420,470,420],...rs(60,150,360,270),...rs(120,90,240,60),[100,84,380,84]);
const DAYWIN=[];
for(let r=0;r<3;r++)for(let c=0;c<4;c++){DAYWIN.push([80+c*86,170+r*70]);DAY.push(...rs(80+c*86,170+r*70,56,50))}
DAY.push(...rs(195,360,60,60));
for(let i=0;i<3;i++)DAY.push(...rs(140+i*75,100,50,40));
DAY.push([440,84,440,420],[434,84,446,84],[434,420,446,420],[60,445,420,445],[60,439,60,451],[420,439,420,451]);
DAY.push(...rs(520,96,190,16),...rs(520,140,160,8),...rs(520,160,120,8),...rs(520,180,150,8),...rs(520,220,110,34),...rs(520,290,190,110),[520,290,710,400],[710,290,520,400]);
function drawSegs(segs,ox,oy,lt,t0,span,a){
  const n=segs.length;
  for(let k=0;k<n;k++){
    const ps=eo(pr(lt,t0+k/n*span,t0+k/n*span+.3));if(ps<=0)continue;
    const [x1,y1,x2,y2]=segs[k];
    LN(ox+x1,oy+y1,ox+x1+(x2-x1)*ps,oy+y1+(y2-y1)*ps,k<7?G:S,a*.9,2,k<7?6:0);
  }
}
function dayan(lt,gx,gy){
  drawSegs(DAY,gx,gy,lt,.1,.9,1);
  for(let i=0;i<3;i++)CI(gx+20+i*20,gy+20,5,S,eo(pr(lt,.15,.4)),2);
  if(lt>1.3){
    const j=Math.floor(lt*5)%12,w=DAYWIN[j],f=eo(pr(lt,1.3,1.5));
    RC(gx+w[0],gy+w[1],56,50,{s:S,sa:0,f:S,fa:.28*f});
    const sx=60+((lt*.5)%1)*360;LN(gx+sx,gy+150,gx+sx,gy+420,S,.3*f,1.5,6);
  }
}
const BR=[],CD=[];
for(let r=0;r<6;r++)for(let c=0;c<6;c++)BR.push([c*112+(r%2?56:0),r*74,100,62]);
const CEL=[[0,0,236,120],[0,138,170,10],[0,160,100,10],[0,184,100,28],[10,10,56,18],[120,160,70,10]];
for(let r=0;r<6;r++)for(let c=0;c<6;c++){const cx=(c%3)*256,cy=Math.floor(c/3)*236,e=CEL[r];CD.push([cx+e[0],cy+e[1],e[2],e[3]])}
function viaco(lt,gx,gy){

let ac=null,T0=0,playing=false,raf=0,recorder=null,chunks=[];
const $=id=>document.getElementById(id);
function setUI(t){$('pi').style.width=(t/DUR*100)+'%';$('tc').textContent=t.toFixed(2).padStart(5,'0')+' / 15.00'}
async function start(record){
  cancelAnimationFrame(raf);if(ac){try{ac.close()}catch(e){}}
  ac=new (window.AudioContext||window.webkitAudioContext)();await ac.resume();
  const comp=ac.createDynamicsCompressor();comp.threshold.value=-12;comp.ratio.value=4;
  const mg=ac.createGain();mg.gain.value=.85;mg.connect(comp);comp.connect(ac.destination);
  const dest=ac.createMediaStreamDestination();comp.connect(dest);
  T0=ac.currentTime+.15;buildAudio(ac,mg,T0);
  mg.gain.setValueAtTime(.85,T0+14.5);mg.gain.linearRampToValueAtTime(0,T0+15);
  $('overlay').style.display='none';$('replay').disabled=true;$('rec').disabled=true;
  recorder=null;
  if(record){
    const st=cv.captureStream(60);dest.stream.getAudioTracks().forEach(tr=>st.addTrack(tr));
    const mt=['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'].find(m=>MediaRecorder.isTypeSupported(m));
    chunks=[];recorder=new MediaRecorder(st,{mimeType:mt,videoBitsPerSecond:14e6});
    recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
    recorder.onstop=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(chunks,{type:'video/webm'}));a.download='74Hamed_ident_15s.webm';a.click()};
    recorder.start(250);
  }
  playing=true;loop();
}
function loop(){
  if(!playing)return;
  const t=ac.currentTime-T0;
  if(t>=DUR){finish();return}
  render(Math.max(0,t));setUI(Math.max(0,t));raf=requestAnimationFrame(loop);
}
function finish(){
  playing=false;render(DUR);setUI(DUR);
  if(recorder&&recorder.state!=='inactive')setTimeout(()=>recorder.stop(),200);
  $('replay').disabled=false;$('rec').disabled=false;
}
$('play').onclick=()=>start(false);
$('overlay').onclick=e=>{if(e.target.id==='overlay')start(false)};
$('replay').onclick=()=>start(false);
$('rec').onclick=()=>start(true);

/* Deterministic rendering for the profile GIF exporter. */
if(new URLSearchParams(location.search).has('render')){
  window.profileIdent={render,ready:false};
}

/* ---------- init ---------- */
(async()=>{
  try{await Promise.all([400,500,700,800].map(w=>document.fonts.load(`${w} 40px "JetBrains Mono"`)));await document.fonts.ready}catch(e){}
  buildParticles();layoutWords();render(13.6);setUI(13.6);
  if(window.profileIdent)window.profileIdent.ready=true;
})();
})();
</script>
